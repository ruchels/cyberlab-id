apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyberlab-web
  namespace: cyberlab-prod
  labels:
    app: cyberlab-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cyberlab-web
  template:
    metadata:
      labels:
        app: cyberlab-web
    spec:
      containers:
        - name: web
          image: cyberlab-id/web:2.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: cyberlab-data-pvc
