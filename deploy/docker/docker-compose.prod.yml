services:
  # Next.js Fullstack Web & API
  cyberlab-app:
    build:
      context: ../../website
      dockerfile: Dockerfile
    image: cyberlab-id/web:2.5.0
    container_name: cyberlab-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - cyberlab-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - cyberlab-backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Nginx SSL & Reverse Proxy Gateway
  cyberlab-proxy:
    image: nginx:1.25-alpine
    container_name: cyberlab-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/cyberlab.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      cyberlab-app:
        condition: service_healthy
    networks:
      - cyberlab-backend
      - cyberlab-public

  # Range Janitor (Sweeps expired lab sessions every 60 seconds)
  range-janitor:
    image: alpine:3.19
    container_name: cyberlab-range-janitor
    restart: always
    command: >
      sh -c "while true; do
        wget -qO- http://cyberlab-app:3000/api/range/health > /dev/null 2>&1 || true;
        sleep 60;
      done"
    depends_on:
      - cyberlab-app
    networks:
      - cyberlab-backend

  # Database Backup Cron (Automated Daily Snapshots & 7-day retention)
  backup-cron:
    image: node:24-alpine
    container_name: cyberlab-backup-cron
    restart: always
    working_dir: /workspace
    volumes:
      - cyberlab-data:/workspace/data
      - ../../backups:/workspace/backups
      - ../../scripts:/workspace/scripts:ro
    command: >
      sh -c "while true; do
        echo '[BACKUP CRON] Running scheduled snapshot...';
        node scripts/backup.mjs || true;
        sleep 86400;
      done"
    networks:
      - cyberlab-backend

networks:
  cyberlab-public:
    driver: bridge
  cyberlab-backend:
    driver: bridge
    internal: false

volumes:
  cyberlab-data:
    driver: local
